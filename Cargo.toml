[package]
name = "mini-redis"
version = "0.1.0"
edition = "2021"

[dependencies]
rustyline = "18.0.1"
tokio = { version = "1.47", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
redis = { version = "1.8.1", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.47", features = ["full", "test-util"] }

